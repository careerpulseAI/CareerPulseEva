<title>CareerPulse · Administration</title>

<style>
:root, [data-theme="dark"]{
  --bg:#060d22; --side:#071028; --card:#0c1734; --card2:#0f1d40; --line:rgba(148,163,184,.13); --line2:rgba(148,163,184,.24);
  --ink:#eef2ff; --mut:#8e9cc0; --hover:rgba(96,128,255,.10); --input:#0b1631; --rd:#f87171; --gn:#34d399;

}
[data-theme="light"]{

  --ink:#0f172a; --mut:#5d6987; --hover:#eef3ff; --input:#f3f6fc; --rd:#dc2626; --gn:#059669;

}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:#6ea8ff; }
svg.i{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.side{ position:fixed; inset:0 auto 0 0; width:256px; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px 14px; z-index:40; transition:transform .25s ease; overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:11px; padding:4px 10px 24px; font-weight:800; font-size:1.42rem; letter-spacing:-.4px; }

.nav{ display:flex; flex-direction:column; gap:3px; }
.nav .sec{ font-size:.68rem; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--mut); padding:14px 16px 6px; opacity:.8; }
.nav button{ display:flex; align-items:center; gap:14px; width:100%; border:none; background:none; padding:12px 16px; border-radius:12px; color:var(--ink); font-weight:500; text-align:left; opacity:.86; transition:background .15s, opacity .15s; }
.nav button:hover{ background:var(--hover); opacity:1; }
.nav button.on{ background:linear-gradient(135deg,#2563eb,#4064ff); color:#fff; opacity:1; box-shadow:0 12px 26px -12px rgba(37,99,235,.95); font-weight:700; }
.nav .badge{ margin-left:auto; background:#ef4444; color:#fff; font-size:.7rem; font-weight:800; min-width:20px; text-align:center; padding:2px 7px; border-radius:999px; }
.side .sp{ flex:1; min-height:16px; }

.side .ver svg{ width:28px; height:26px; } .side .ver b{ display:block; } .side .ver small{ color:var(--mut); font-size:.78rem; }
.main{ margin-left:256px; min-width:0; }

    var L=c.liste;
    h+='<div class="box">'+(L.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Échange</th><th class="hide-s">Sujet</th><th>Msg</th><th class="hide-s">État</th><th class="hide-s">Dernière activité</th><th></th></tr></thead><tbody>'+L.map(function(x){
        return '<tr><td><b>'+esc(x.pro||'Pro')+'</b> <span class="sub">↔</span> <b>'+esc(x.cand)+'</b><small>Ouverte le '+fd(x.cree)+'</small></td><td class="hide-s">'+esc(x.sujet||'—')+'</td><td><span class="pill">'+x.messages+'</span></td><td class="hide-s"><span class="tag t-'+(x.bloque?'bloque':x.statut==='close'?'close':'ouverte')+'">'+(x.bloque?'Bloquée':x.statut==='close'?'Close':'Ouverte')+'</span></td><td class="hide-s">'+fd(x.dernier,true)+'</td><td><button class="bt sm" type="button" data-lire="'+x.col+'|'+esc(x.id)+'">'+I('lock')+'Modérer</button></td></tr>'; }).join('')+'</tbody></table></div>'
      +(c.suite?'<div style="text-align:center;margin-top:14px"><button class="bt" type="button" id="more"'+(c.charge?' disabled':'')+'>'+(c.charge?'Chargement…':'Afficher 50 de plus')+'</button></div>':''):vide('💬','Aucune conversation pour l\'instant.'))+'</div>';
    return h;
  }

  function vSuspendus(){ var L=D.moderes||[];
    return entete('Comptes suspendus et bloqués',L.length?L.length+' compte'+(L.length>1?'s':'')+' concerné'+(L.length>1?'s':''):'Aucun compte concerné pour l\'instant','lock','g3')
      +'<div class="box">'+(L.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Compte</th><th>État</th><th class="hide-s">Motif</th><th class="hide-s">Depuis</th><th>Actions</th></tr></thead><tbody>'+L.map(function(m){ var n=m.nom||m.email||'Compte';
        return '<tr'+(m.col?' class="clic" data-fiche="'+m.col+'|'+esc(m.uid)+'"':'')+'><td><div class="who">'+logo({ nom:n, uid:m.uid })+'<div><b>'+esc(n)+'</b><small>'+esc(m.type)+(m.email&&m.nom?' · '+esc(m.email):'')+'</small></div></div></td><td>'+etatTag(m.etat)+'</td><td class="hide-s">'+esc(m.motif||'—')+'</td><td class="hide-s">'+fd(m.at,true)+'</td><td>'+actions(m.uid,n,m.etat,true)+'</td></tr>'; }).join('')+'</tbody></table></div>':vide('✅','Aucun compte suspendu ou bloqué.'))+'</div>';
  }

  function vAvis(){ var AV=D.avis||{}, AL=(D.avisListe||[]).filter(function(a){ return S.af==='tous'||a.cible===S.af; });
    var cartes=[['eva','EVA','g2'],['lisa','Lisa','g6'],['careerpulse','CareerPulse','g1']].map(function(n){ var a=AV[n[0]];
      return '<div class="tile '+n[2]+'" style="min-height:0"><div class="ic">'+I('star')+'</div><h4>'+n[1]+'</h4>'+(a&&a.n?'<b>'+num(a.note)+' / 5</b><small>'+a.n+' avis · qualité '+num(a.qualite)+' · efficacité '+num(a.efficacite)+' · utilité '+num(a.utilite)+'</small>':'<b>—</b><small>Pas encore d\'avis</small>')+'</div>'; }).join('');
    var F=[['tous','Tous'],['eva','EVA'],['lisa','Lisa'],['careerpulse','CareerPulse']];
    return entete('Avis des utilisateurs','Notes laissées avec le badge « Ton avis compte ».','star','g3')+'<div class="avg">'+cartes+'</div>'
      +'<div class="box"><div class="bh"><h2>Derniers avis</h2></div><div class="flt">'+F.map(function(f){ return '<button type="button" data-set="af|'+f[0]+'"'+(S.af===f[0]?' class="on"':'')+'>'+f[1]+'</button>'; }).join('')+'</div>'
      +(AL.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Note</th><th>Page</th><th>Sur</th><th class="hide-s">Date</th></tr></thead><tbody>'+AL.map(function(a){ return '<tr><td><span class="stars">'+'★★★★★'.slice(0,Math.round(a.note))+'</span></td><td>'+esc(a.label||'—')+'</td><td>'+(CIB[a.cible]||esc(a.cible))+'</td><td class="hide-s">'+fd(a.at,true)+'</td></tr>'; }).join('')+'</tbody></table></div>':vide('⭐','Aucun avis dans ce filtre.'))+'</div>';
  }
  function vRevenus(){ var K=calc(), R=D.revenus||[], P0=(D.pros||[]).filter(function(p){ return !p.etat; }), a='rgba(14,147,180,.22)';
    var ab=P0.filter(function(p){ return p.abo.statut==='actif'||p.abo.statut==='essai'; }).sort(function(x,y){ return new Date(x.abo.fin)-new Date(y.abo.fin); });
    var bientot=P0.filter(function(p){ return p.abo.statut==='essai' && p.abo.fin && new Date(p.abo.fin)-Date.now()<4*864e5; });
    var parT={ Employeur:0, Centre:0 }; P0.forEach(function(p){ if(p.abo.statut==='actif') parT[p.type]+=p.abo.plan==='an'?(p.col==='organismes'?150:500)/12:(p.col==='organismes'?15:50); });
    return entete('Revenus','Montants HT, calculés à partir des abonnements actifs.','wallet','g5')
      +'<div class="stats">'+stat('Revenu mensuel',eur(D.revenuMensuel),a)+stat('Sur un an (estimé)',eur(D.revenuMensuel*12),a)+stat('Employeurs',eur(parT.Employeur),a)+stat('Centres',eur(parT.Centre),a)+stat('Essais en cours',K.c.essai,a)+'</div>'
      +'<div class="box"><div class="bh"><span class="ico">'+I('money')+'</span><h2>Revenu mensuel · 30 jours</h2></div>'+courbe([{ nom:'Revenu', couleur:'#22b8d6', valeurs:R.map(function(r){ return r.mrr; }) }],{ labels:R.map(function(r){ return r.jour; }), eur:true })+'</div>'
      +(bientot.length?'<div class="box" style="margin-top:20px"><div class="bh"><span class="ico">'+I('clock')+'</span><h2>Essais qui finissent bientôt</h2></div><ul class="act">'+bientot.map(function(p){ return '<li data-fiche="'+p.col+'|'+esc(p.uid)+'" style="cursor:pointer"><span class="ai" style="background:#d97706">'+I('clock')+'</span><div><b>'+esc(p.nom||p.email)+'</b><small>'+p.type+' · fin le '+fd(p.abo.fin)+' · '+esc(p.email)+'</small></div></li>'; }).join('')+'</ul></div>':'')
      +'<div class="box" style="margin-top:20px"><div class="bh"><h2>Abonnés et essais</h2></div>'+(ab.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Espace</th><th>Statut</th><th>Formule</th><th class="hide-s">Échéance</th></tr></thead><tbody>'+ab.map(function(p){ var x=p.abo, prix=x.plan==='an'?(p.col==='organismes'?'150 €/an':'500 €/an'):(p.col==='organismes'?'15 €/mois':'50 €/mois');
        return '<tr class="clic" data-fiche="'+p.col+'|'+esc(p.uid)+'"><td><div class="who">'+logo(p)+'<div><b>'+esc(p.nom||'Sans nom')+'</b><small>'+p.type+'</small></div></div></td><td><span class="tag t-'+x.statut+'">'+LIB[x.statut]+'</span>'+(x.resiliation?'<small>résiliation demandée</small>':'')+'</td><td>'+prix+'</td><td class="hide-s">'+fd(x.fin)+'</td></tr>'; }).join('')+'</tbody></table></div>':vide('💶','Aucun abonné pour l\'instant.'))+'</div>';
  }
  function vStats(){ var K=calc(), V=D.visites||[], som=function(l){ return l.reduce(function(s,x){ return s+x.n; },0); };
    return entete('Statistiques','Les 30 derniers jours, jour par jour.','chart','g6')
      +'<div class="stats">'+stat('Visites',K.v30)+stat('Inscriptions',som(K.insc))+stat('Avis',som(K.avisJ))+stat('Demandes Pro',som(K.proJ))+stat('Signalements',som(K.sigJ),'rgba(225,29,72,.2)')+'</div>'
      +'<div class="box"><div class="bh"><span class="ico">'+I('chart')+'</span><h2>Activité · 30 jours</h2></div>'
      +courbe([{ nom:'Visites', couleur:'#5b7cfa', valeurs:V.map(function(v){ return v.n; }) },{ nom:'Inscriptions', couleur:'#14b8a6', valeurs:K.insc.map(function(x){ return x.n; }) },{ nom:'Avis', couleur:'#f59e0b', valeurs:K.avisJ.map(function(x){ return x.n; }) },{ nom:'Demandes Pro', couleur:'#d946ef', valeurs:K.proJ.map(function(x){ return x.n; }) },{ nom:'Signalements', couleur:'#f43f5e', valeurs:K.sigJ.map(function(x){ return x.n; }) }],{ labels:V.map(function(v){ return v.jour; }) })+'</div>'
      +'<div class="box" style="margin-top:20px"><div class="bh"><span class="ico">'+I('clock')+'</span><h2>Toutes les activités récentes</h2></div>'+activites(40)+'</div>';
  }
  function vParams(){ var th=document.documentElement.getAttribute('data-theme'), u=A.currentUser||{};
    var lien=function(t,s,href){ return '<div class="set"><div><b>'+t+'</b><div class="sub">'+s+'</div></div><a class="bt sm" href="'+href+'" target="_blank" rel="noopener" style="text-decoration:none">'+I('ext')+'Ouvrir</a></div>'; };
    return entete('Paramètres','','gear','g6')
      +'<div class="box"><div class="set"><div><b>Thème</b><div class="sub">'+(th==='light'?'Clair':'Sombre')+'</div></div><button class="bt sm" type="button" id="th2">'+(th==='light'?'Passer en sombre 🌙':'Passer en clair ☀️')+'</button></div>'
      +'<div class="set"><div><b>Compte administrateur</b><div class="sub">'+esc(u.email||'')+'</div></div></div>'
      +lien('Stripe','Paiements, clients, factures','https://dashboard.stripe.com')+lien('Firebase','Base de données, comptes, journal de modération','https://console.firebase.google.com/project/careerpulseeva/firestore')+lien('Vercel','Hébergement du site','https://vercel.com/dashboard')
      +'<div class="set"><div><b>Données</b><div class="sub">Mises à jour le '+fd(D.maj,true)+'</div></div><button class="bt sm" type="button" id="rf">Actualiser</button></div></div>';
  }

  function rendre(){
    var V={ home:vHome, visiteurs:vVisiteurs, membres:vMembres, pro:vPro, fiche:vFiche, signalements:vSignalements, conversations:vConversations, suspendus:vSuspendus, avis:vAvis, revenus:vRevenus, stats:vStats, params:vParams };
    app.innerHTML=shell((V[VUE]||vHome)()); bindCommun();
  }
  function charger(silencieux){
    if(!silencieux || !D) app.innerHTML='<div class="load"><div class="spin"></div>Chargement des données…</div>';
    api('GET').then(function(j){
      if(j._code===200){ D=j; rendre(); return; }
      var msg=j._code===403&&j.uid?'<b>Dernière étape.</b> Copie ton identifiant ci-dessous et colle-le dans Vercel (Settings → Environment Variables) sous le nom <b>ADMIN_UID</b>, puis fais <b>Redeploy</b>.<br><br><code>'+esc(j.uid)+'</code>'
        : j._code===403?'<b>Accès refusé.</b> Ce compte n\'est pas le compte administrateur.' : esc(j.erreur||('Impossible de charger les données (code '+j._code+').'));
      app.innerHTML='<div class="login"><div class="box"><div class="brand">'+LOGO+'CareerPulse</div><div class="note">'+msg+'</div><button class="gg" type="button" id="lo2" style="margin-top:14px">Se déconnecter</button></div></div>';
      document.getElementById('lo2').onclick=function(){ A.signOut(); };
    }).catch(function(){ toast('Connexion au serveur impossible. Réessaie dans un instant.'); });
  }
  A.onAuthStateChanged(function(u){ if(u) charger(); else { D=null; loginView(); } });
})();
</script>
</body>
</html>
