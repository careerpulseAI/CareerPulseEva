<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CareerPulse · Administration</title>
<script>try{ var t=localStorage.getItem('cp_admin_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}</script>
<style>
:root, [data-theme="dark"]{
  --bg:#070f24; --bg2:#0b1530; --side:#08112a; --card:#0d1a38; --card2:#0f1f42; --line:rgba(148,163,184,.16); --line2:rgba(148,163,184,.26);
  --ink:#f1f5ff; --mut:#93a1c3; --mut2:#6b7aa0; --hover:rgba(99,132,255,.10); --input:#0c1836;
  --ok:#10b981; --rd:#f87171; --shadow:0 18px 40px -26px rgba(0,0,0,.8);
}
[data-theme="light"]{
  --bg:#eef2fb; --bg2:#ffffff; --side:#ffffff; --card:#ffffff; --card2:#f7f9fe; --line:#e3e8f3; --line2:#d5dcec;
  --ink:#0f172a; --mut:#5b6785; --mut2:#8691ad; --hover:#eef3ff; --input:#f4f7fd;
  --ok:#059669; --rd:#dc2626; --shadow:0 16px 36px -28px rgba(15,23,42,.45);
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:#60a5fa; }
svg.i{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* ── Structure ── */
.lay{ display:flex; min-height:100vh; }
.side{ position:fixed; inset:0 auto 0 0; width:252px; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px; z-index:40; transition:transform .25s ease; }
.brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 22px; font-weight:800; font-size:1.3rem; letter-spacing:-.3px; }
.brand svg{ width:38px; height:34px; }
.nav{ display:flex; flex-direction:column; gap:4px; }
.nav button{ display:flex; align-items:center; gap:14px; width:100%; border:none; background:none; padding:12px 14px; border-radius:12px; color:var(--ink); font-weight:500; text-align:left; opacity:.88; }
.nav button:hover{ background:var(--hover); opacity:1; }
.nav button.on{ background:linear-gradient(135deg,#2563eb,#3b5bfd); color:#fff; opacity:1; box-shadow:0 10px 24px -12px rgba(37,99,235,.9); font-weight:700; }
.nav .badge{ margin-left:auto; background:#ef4444; color:#fff; font-size:.7rem; font-weight:800; padding:2px 7px; border-radius:999px; }
.side .sp{ flex:1; }
.side .out{ display:flex; align-items:center; gap:12px; border:none; background:none; padding:12px 14px; color:var(--ink); opacity:.85; border-radius:12px; font-size:.9rem; }
.side .out:hover{ background:var(--hover); }
.side .ver{ display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); margin-top:10px; padding:16px 10px 4px; }
.side .ver svg{ width:26px; height:24px; }
.side .ver b{ display:block; font-size:.92rem; } .side .ver small{ color:var(--mut); font-size:.76rem; }
.main{ flex:1; margin-left:252px; min-width:0; }
.top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.burger{ display:none; border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:8px; }
.search{ position:relative; flex:1; max-width:540px; }
.search input{ width:100%; background:var(--input); border:1px solid var(--line2); border-radius:12px; padding:11px 14px 11px 42px; outline:none; }
.search input:focus{ border-color:#3b82f6; box-shadow:0 0 0 4px rgba(59,130,246,.18); }
.search .i{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--mut); }
.res{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--card); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); max-height:360px; overflow:auto; padding:6px; }
.res button{ display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; border:none; background:none; padding:10px; border-radius:10px; }
.res button:hover{ background:var(--hover); }
.res small{ color:var(--mut); }
.top .grow{ flex:1; }
.ib{ position:relative; border:1px solid var(--line2); background:var(--card); border-radius:12px; padding:9px; display:grid; place-items:center; }
.ib .dot{ position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#ef4444; color:#fff; font-size:.68rem; font-weight:800; display:grid; place-items:center; }
.me{ display:flex; align-items:center; gap:10px; font-weight:600; }
.me .av{ width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#06b6d4); display:grid; place-items:center; color:#fff; }
.wrap{ padding:26px 28px 50px; max-width:1320px; }
.hello{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.hello h1{ margin:0; font-size:1.9rem; letter-spacing:-.5px; }
.hello p{ margin:6px 0 0; color:var(--mut); }
.datep{ display:flex; align-items:center; gap:10px; border:1px solid var(--line2); background:var(--card); padding:10px 16px; border-radius:12px; font-weight:600; font-size:.9rem; }

/* ── Cartes ── */
.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.kc{ position:relative; overflow:hidden; border:none; text-align:left; border-radius:18px; padding:20px 22px 18px; color:#fff; min-height:190px; box-shadow:0 22px 40px -26px rgba(0,0,0,.7); }
.kc::after{ content:""; position:absolute; inset:0; background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 55%); pointer-events:none; }
.kc .ic{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; }
.kc .ar{ position:absolute; top:22px; right:20px; opacity:.9; }
.kc h3{ margin:14px 0 2px; font-size:1.05rem; font-weight:700; }
.kc b{ display:block; font-size:2.3rem; line-height:1.1; letter-spacing:-1px; }
.kc small{ opacity:.88; font-size:.84rem; }
.kc .spk{ position:absolute; right:16px; bottom:16px; width:96px; height:34px; }
.g1{ background:linear-gradient(135deg,#4f46e5,#2563eb 60%,#1d4ed8); }
.g2{ background:linear-gradient(135deg,#0d9488,#0f766e 60%,#115e59); }
.g3{ background:linear-gradient(135deg,#f59e0b,#ea580c); }
.g4{ background:linear-gradient(135deg,#d946ef,#a21caf 60%,#86198f); }
.g5{ background:linear-gradient(135deg,#0891b2,#0e7490); }
.g6{ background:linear-gradient(135deg,#6366f1,#4338ca); }
.row{ display:grid; grid-template-columns:1.7fr 1fr; gap:18px; margin-top:18px; }
.row2{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; margin-top:18px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow); min-width:0; }
.bh{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.bh h2{ margin:0; font-size:1.1rem; }
.bh .ico{ width:36px; height:36px; border-radius:50%; background:var(--hover); display:grid; place-items:center; color:#93c5fd; }
.bh .r{ margin-left:auto; }
.pill{ border:1px solid var(--line2); background:var(--card2); border-radius:10px; padding:7px 12px; font-size:.82rem; color:var(--mut); }
.link{ border:none; background:none; color:#60a5fa; font-weight:600; font-size:.86rem; }
.big{ font-size:2rem; font-weight:800; letter-spacing:-.6px; margin:4px 0 0; }
.sub{ color:var(--mut); font-size:.88rem; }
.chart{ width:100%; height:auto; display:block; margin-top:12px; }
.chart text{ fill:var(--mut); font-size:11px; }
.qa{ display:flex; flex-direction:column; gap:10px; }
.qa button{ display:flex; align-items:center; gap:14px; width:100%; border:1px solid var(--line2); background:var(--card2); border-radius:12px; padding:14px 16px; text-align:left; font-weight:600; }
.qa button:hover{ border-color:#3b82f6; background:var(--hover); }
.qa .i:first-child{ color:#818cf8; }
.qa .chev{ margin-left:auto; color:var(--mut); }
.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.tile{ position:relative; border:none; text-align:left; color:#fff; border-radius:16px; padding:16px; min-height:148px; overflow:hidden; }
.tile .ic{ width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; }
.tile h4{ margin:12px 0 2px; font-size:.98rem; }
.tile b{ display:block; font-size:1.5rem; }
.tile small{ opacity:.85; font-size:.78rem; }
.tile .ar{ position:absolute; right:14px; bottom:14px; }
.act{ list-style:none; margin:0; padding:0; }
.act li{ display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
.act li:last-child{ border-bottom:none; }
.act .ai{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none; color:#fff; }
.act b{ display:block; font-size:.9rem; font-weight:600; }
.act small{ color:var(--mut); font-size:.78rem; }
.banner{ display:flex; align-items:center; gap:18px; margin-top:18px; border-radius:18px; padding:20px 24px; background:linear-gradient(110deg,var(--card) 30%,#1e3a8a 140%); border:1px solid var(--line); box-shadow:var(--shadow); }
.banner .crown{ width:56px; height:56px; border-radius:50%; background:var(--hover); display:grid; place-items:center; font-size:1.6rem; flex:none; }
.banner h3{ margin:0; font-size:1.08rem; } .banner p{ margin:4px 0 0; color:var(--mut); }
.banner .cta{ margin-left:auto; border:none; color:#fff; background:linear-gradient(135deg,#2563eb,#4f46e5); padding:13px 20px; border-radius:12px; font-weight:700; display:flex; align-items:center; gap:10px; white-space:nowrap; }

/* ── Pages ── */
.ph{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.ph h1{ margin:0; font-size:1.6rem; } .ph p{ margin:4px 0 0; color:var(--mut); }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:18px; }
.st{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
.st span{ color:var(--mut); font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.st b{ display:block; font-size:1.6rem; margin-top:4px; }
.tbl{ width:100%; border-collapse:collapse; font-size:.88rem; }
.tbl th{ text-align:left; color:var(--mut); font-weight:600; font-size:.74rem; text-transform:uppercase; letter-spacing:.4px; padding:10px; border-bottom:1px solid var(--line2); }
.tbl td{ padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
.tbl td small{ display:block; color:var(--mut); }
.scroll{ overflow-x:auto; }
.tag{ display:inline-block; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.t-actif{ background:rgba(16,185,129,.16); color:#34d399; } .t-essai{ background:rgba(59,130,246,.16); color:#60a5fa; }
.t-expire{ background:rgba(248,113,113,.16); color:#f87171; } .t-offert{ background:rgba(168,85,247,.16); color:#c084fc; }
.t-aucun{ background:rgba(148,163,184,.16); color:var(--mut); }
[data-theme="light"] .t-actif{ color:#047857; } [data-theme="light"] .t-essai{ color:#1d4ed8; } [data-theme="light"] .t-expire{ color:#b91c1c; } [data-theme="light"] .t-offert{ color:#7e22ce; }
.flt{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.flt button{ border:1px solid var(--line2); background:var(--card2); border-radius:999px; padding:7px 14px; font-size:.82rem; font-weight:600; }
.flt button.on{ background:#2563eb; border-color:#2563eb; color:#fff; }
.pend{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); margin-bottom:22px; }
.pc h3{ margin:4px 0 0; font-size:1.05rem; }
.pc dl{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:12px 0 14px; font-size:.87rem; }
.pc dt{ color:var(--mut); } .pc dd{ margin:0; word-break:break-word; }
.btns{ display:flex; gap:10px; }
.ok,.no{ flex:1; border:none; border-radius:12px; padding:12px; font-weight:700; }
.ok{ background:linear-gradient(135deg,#059669,#0d9488); color:#fff; }
.no{ background:transparent; color:var(--rd); border:1px solid color-mix(in srgb, var(--rd) 45%, transparent); }
.ok:disabled,.no:disabled{ opacity:.5; }
.empty{ color:var(--mut); padding:10px 0; }
.ftxt{ width:100%; max-width:360px; background:var(--input); border:1px solid var(--line2); border-radius:12px; padding:10px 14px; outline:none; margin-bottom:12px; }
.avg{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:18px; }
.stars{ color:#f59e0b; letter-spacing:2px; }
.kv{ list-style:none; padding:0; margin:10px 0 0; }
.kv li{ display:flex; justify-content:space-between; padding:4px 0; color:var(--mut); }
.kv li b{ color:var(--ink); }
.set{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
.set:last-child{ border-bottom:none; }
.sw{ border:1px solid var(--line2); background:var(--card2); border-radius:12px; padding:9px 14px; font-weight:600; }
.note{ background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.35); border-radius:14px; padding:16px; }
.note code{ background:var(--card); padding:3px 8px; border-radius:6px; user-select:all; word-break:break-all; }
.load{ color:var(--mut); padding:60px 0; text-align:center; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111c3d; color:#fff; padding:11px 18px; border-radius:12px; z-index:90; box-shadow:0 12px 30px -10px rgba(0,0,0,.6); }
.veil{ display:none; }

/* ── Connexion ── */
.login{ min-height:100vh; display:grid; place-items:center; padding:16px; background:radial-gradient(90% 60% at 80% 0%,rgba(37,99,235,.25),transparent),var(--bg); }
.login .box{ width:100%; max-width:400px; padding:28px 24px; }
.login .brand{ padding:0 0 18px; }
.login h1{ margin:0 0 4px; font-size:1.3rem; } .login p{ margin:0 0 18px; color:var(--mut); }
.login input{ width:100%; background:var(--input); border:1px solid var(--line2); border-radius:12px; padding:13px 14px; margin-bottom:10px; outline:none; }
.login input:focus{ border-color:#3b82f6; }
.login .go{ width:100%; border:none; border-radius:12px; padding:13px; font-weight:700; color:#fff; background:linear-gradient(135deg,#2563eb,#4f46e5); }
.login .gg{ width:100%; margin-top:10px; border:1px solid var(--line2); background:var(--card2); border-radius:12px; padding:12px; font-weight:600; }
.err{ color:var(--rd); font-size:.86rem; min-height:1.2em; margin-top:10px; }

@media (max-width:1180px){ .kpis{ grid-template-columns:repeat(2,1fr); } .row,.row2{ grid-template-columns:1fr; } }
@media (max-width:900px){
  .side{ transform:translateX(-100%); box-shadow:none; }
  body.menu .side{ transform:none; box-shadow:0 0 60px rgba(0,0,0,.6); }
  body.menu .veil{ display:block; position:fixed; inset:0; background:rgba(2,6,23,.55); z-index:35; }
  .main{ margin-left:0; }
  .burger{ display:grid; place-items:center; }
  .top{ padding:12px 16px; gap:10px; }
  .me span{ display:none; }
  .wrap{ padding:20px 16px 40px; }
  .hello h1{ font-size:1.5rem; }
}
@media (max-width:600px){
  .kpis{ grid-template-columns:1fr 1fr; gap:12px; }
  .kc{ min-height:160px; padding:16px; } .kc b{ font-size:1.9rem; } .kc .spk{ width:70px; } .kc h3{ font-size:.95rem; }
  .tiles{ grid-template-columns:1fr 1fr; }
  .banner{ flex-wrap:wrap; } .banner .cta{ margin-left:0; width:100%; justify-content:center; }
  .datep{ display:none; }
  .top .grow{ display:none; } .search{ min-width:0; }
  .kc .spk{ position:static; display:block; width:100%; height:26px; margin-top:8px; }
  .hide-s{ display:none; }
}
</style>
</head>

    return entete('Visiteurs','Une visite = une personne qui ouvre le site (comptée une fois par session, sans cookie).')
      +'<div class="stats">'+stat('Aujourd\'hui',K.auj)+stat('7 derniers jours',K.v7)+stat('30 derniers jours',K.v30)+stat('Moyenne par jour',num(Math.round(K.v30/30*10)/10))+'</div>'
      +'<div class="box"><div class="bh"><span class="ico">'+I('eye')+'</span><h2>Visites par jour</h2></div>'+courbe([{ nom:'Visites', couleur:'#3b82f6', valeurs:V.map(function(v){ return v.n; }) }],{ labels:V.map(function(v){ return v.jour; }) })+'</div>';
  }
  function vMembres(){ var M=D.membres||{}, t=MQ.trim().toLowerCase();
    var L=(M.liste||[]).filter(function(m){ return !t || (m.nom+' '+m.email).toLowerCase().indexOf(t)>-1; });
    return entete('Membres',(M.total||0)+' membres inscrits')
      +'<div class="stats">'+stat('Total',M.total||0)+stat('Cette semaine','+'+(M.nouveaux7||0))+stat('30 derniers jours','+'+(M.nouveaux30||0))+stat('E-mails vérifiés',M.verifies||0)+stat('Connectés cette semaine',M.actifs7||0)+'</div>'
      +'<div class="box"><input class="ftxt" id="mq" type="search" placeholder="Filtrer par nom ou e-mail…" value="'+esc(MQ)+'">'
      +(L.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Membre</th><th>Inscription</th><th class="hide-s">Dernière connexion</th><th class="hide-s">E-mail</th></tr></thead><tbody>'+L.slice(0,300).map(function(m){
        return '<tr><td><b>'+esc(m.nom||'—')+'</b><small>'+esc(m.email)+'</small></td><td>'+fd(m.cree)+'</td><td class="hide-s">'+fd(m.vu)+'</td><td class="hide-s">'+(m.verifie?'<span class="tag t-actif">Vérifié</span>':'<span class="tag t-aucun">Non vérifié</span>')+'</td></tr>'; }).join('')+'</tbody></table></div>'+(L.length>300?'<div class="sub" style="margin-top:8px">300 premiers résultats affichés. Utilise le filtre pour affiner.</div>':''):'<div class="empty">Aucun membre trouvé.</div>')+'</div>';
  }
  function vAvis(){ var AV=D.avis||{}, AL=(D.avisListe||[]).filter(function(a){ return AF==='tous'||a.cible===AF; });
    var cartes=[['eva','EVA','g2'],['lisa','Lisa','g6'],['careerpulse','CareerPulse','g1']].map(function(n){ var a=AV[n[0]];
      if(!a||!a.n) return '<div class="box"><span class="tag t-aucun">'+n[1]+'</span><div class="empty">Pas encore d\'avis.</div></div>';
      return '<div class="box"><span class="tag t-essai">'+n[1]+'</span><div class="big">'+num(a.note)+' <span class="sub">/ 5</span> <span class="stars">'+'★★★★★'.slice(0,Math.round(a.note))+'</span></div><div class="sub">'+a.n+' avis</div><ul class="kv"><li>Qualité <b>'+num(a.qualite)+'</b></li><li>Efficacité <b>'+num(a.efficacite)+'</b></li><li>Utilité <b>'+num(a.utilite)+'</b></li></ul></div>'; }).join('');
    var F=[['tous','Tous'],['eva','EVA'],['lisa','Lisa'],['careerpulse','CareerPulse']];
    return entete('Avis des utilisateurs','Notes laissées avec le badge « Ton avis compte ».')+'<div class="avg">'+cartes+'</div>'
      +'<div class="box"><div class="bh"><h2>Derniers avis</h2></div><div class="flt">'+F.map(function(f){ return '<button type="button" data-af="'+f[0]+'"'+(AF===f[0]?' class="on"':'')+'>'+f[1]+'</button>'; }).join('')+'</div>'
      +(AL.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Note</th><th>Page</th><th>Sur</th><th class="hide-s">Date</th></tr></thead><tbody>'+AL.map(function(a){ return '<tr><td><span class="stars">'+'★★★★★'.slice(0,Math.round(a.note))+'</span></td><td>'+esc(a.label||'—')+'</td><td>'+(CIB[a.cible]||esc(a.cible))+'</td><td class="hide-s">'+fd(a.at,true)+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="empty">Aucun avis dans ce filtre.</div>')+'</div>';
  }
  function vPro(){ var att=attente(), t=MQ.trim().toLowerCase();
    var h=entete('Espace Pro',att.length+' en attente · '+(D.pros||[]).filter(function(p){ return p.verifie; }).length+' validés');
    h+='<div class="bh"><h2>À valider</h2></div>';
    h+=att.length?'<div class="pend">'+att.map(function(p){
      var rows=[['SIRET',p.siret?'<a href="https://annuaire-entreprises.data.gouv.fr/etablissement/'+encodeURIComponent(p.siret)+'" target="_blank" rel="noopener">'+esc(p.siret)+' ↗</a>':'—']];
      if(p.nda) rows.push(['N° NDA',esc(p.nda)]); if(p.secteur) rows.push(['Secteur',esc(p.secteur)]); rows.push(['Ville',esc(p.ville||'—')]);
      if(p.contact) rows.push(['Contact',esc(p.contact)]); rows.push(['E-mail',p.email?'<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>':'—']);
      if(p.tel) rows.push(['Téléphone',esc(p.tel)]); if(p.site) rows.push(['Site',esc(p.site)]); rows.push(['Demande',fd(p.demandeAt,true)]);
      return '<div class="box pc"><span class="tag '+(p.col==='organismes'?'t-actif':'t-essai')+'">'+p.type+'</span><h3>'+esc(p.nom||'Sans nom')+'</h3><dl>'+rows.map(function(r){ return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'; }).join('')+'</dl>'
        +'<div class="btns"><button class="ok" type="button" data-v="valider" data-c="'+p.col+'" data-u="'+esc(p.uid)+'" data-n="'+esc(p.nom||'ce compte')+'">Valider</button><button class="no" type="button" data-v="refuser" data-c="'+p.col+'" data-u="'+esc(p.uid)+'" data-n="'+esc(p.nom||'ce compte')+'">Refuser</button></div></div>';
    }).join('')+'</div>':'<div class="box empty" style="margin-bottom:22px">Aucune demande en attente. Tout est à jour 👌</div>';
    var F=[['tous','Tous'],['actif','Actifs'],['essai','Essais'],['expire','Expirés'],['offert','Accès offert'],['aucun','Non abonnés']];
    var L=(D.pros||[]).filter(function(p){ return p.verifie && (PF==='tous'||p.abo.statut===PF) && (!t || (p.nom+' '+p.email).toLowerCase().indexOf(t)>-1); }).sort(function(a,b){ return (a.nom||'').localeCompare(b.nom||''); });
    h+='<div class="box"><div class="bh"><h2>Espaces validés</h2>'+(t?'<button type="button" class="link r" id="clr">Effacer « '+esc(MQ)+' »</button>':'')+'</div><div class="flt">'+F.map(function(f){ return '<button type="button" data-pf="'+f[0]+'"'+(PF===f[0]?' class="on"':'')+'>'+f[1]+'</button>'; }).join('')+'</div>';
    h+=L.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Nom</th><th>Type</th><th>Abonnement</th><th class="hide-s">Fin / renouvellement</th></tr></thead><tbody>'+L.map(function(p){ var a=p.abo, pl=a.plan==='an'?'Annuel':a.plan==='mois'?'Mensuel':'';
      return '<tr><td><b>'+esc(p.nom||'Sans nom')+'</b><small>'+esc(p.email)+'</small></td><td>'+p.type+'</td><td><span class="tag t-'+a.statut+'">'+(LIB[a.statut]||a.statut)+'</span>'+(pl?'<small>'+pl+(a.resiliation?' · résiliation demandée':'')+'</small>':'')+'</td><td class="hide-s">'+fd(a.fin)+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="empty">Aucun espace Pro dans ce filtre.</div>';
    return h+'</div>';
  }
  function vRevenus(){ var K=calc(), R=D.revenus||[], P0=D.pros||[];
    var ab=P0.filter(function(p){ return p.abo.statut==='actif'||p.abo.statut==='essai'; }).sort(function(a,b){ return new Date(a.abo.fin)-new Date(b.abo.fin); });
    var bientot=P0.filter(function(p){ return p.abo.statut==='essai' && p.abo.fin && new Date(p.abo.fin)-Date.now()<4*864e5; });
    var parT={ Employeur:0, Centre:0 }; P0.forEach(function(p){ if(p.abo.statut==='actif') parT[p.type]+=p.abo.plan==='an'?(p.col==='organismes'?150:500)/12:(p.col==='organismes'?15:50); });
    return entete('Revenus','Montants HT, calculés à partir des abonnements actifs.')
      +'<div class="stats">'+stat('Revenu mensuel',eur(D.revenuMensuel))+stat('Sur un an (estimé)',eur(D.revenuMensuel*12))+stat('Employeurs',eur(parT.Employeur))+stat('Centres',eur(parT.Centre))+stat('Essais en cours',K.c.essai)+'</div>'
      +'<div class="box"><div class="bh"><span class="ico">'+I('money')+'</span><h2>Revenu mensuel · 30 jours</h2></div>'+courbe([{ nom:'Revenu', couleur:'#6366f1', valeurs:R.map(function(r){ return r.mrr; }) }],{ labels:R.map(function(r){ return r.jour; }), eur:true })+'</div>'
      +(bientot.length?'<div class="box" style="margin-top:18px"><div class="bh"><h2>⏳ Essais qui finissent bientôt</h2></div><ul class="act">'+bientot.map(function(p){ return '<li><span class="ai" style="background:#f59e0b">'+I('clock')+'</span><div><b>'+esc(p.nom||p.email)+'</b><small>'+p.type+' · fin le '+fd(p.abo.fin)+' · '+esc(p.email)+'</small></div></li>'; }).join('')+'</ul></div>':'')
      +'<div class="box" style="margin-top:18px"><div class="bh"><h2>Abonnés et essais</h2></div>'+(ab.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Nom</th><th>Statut</th><th>Formule</th><th class="hide-s">Échéance</th></tr></thead><tbody>'+ab.map(function(p){ var a=p.abo, prix=a.plan==='an'?(p.col==='organismes'?'150 €/an':'500 €/an'):(p.col==='organismes'?'15 €/mois':'50 €/mois');
        return '<tr><td><b>'+esc(p.nom||'Sans nom')+'</b><small>'+p.type+'</small></td><td><span class="tag t-'+a.statut+'">'+LIB[a.statut]+'</span>'+(a.resiliation?'<small>résiliation demandée</small>':'')+'</td><td>'+prix+'</td><td class="hide-s">'+fd(a.fin)+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="empty">Aucun abonné pour l\'instant.</div>')+'</div>';
  }
  function vStats(){ var K=calc(), V=D.visites||[];
    return entete('Statistiques','Les 30 derniers jours, jour par jour.')
      +'<div class="stats">'+stat('Visites',K.v30)+stat('Inscriptions',K.insc.reduce(function(s,x){ return s+x.n; },0))+stat('Avis',K.avisJ.reduce(function(s,x){ return s+x.n; },0))+stat('Demandes Pro',K.proJ.reduce(function(s,x){ return s+x.n; },0))+'</div>'
      +'<div class="box"><div class="bh"><span class="ico">'+I('chart')+'</span><h2>Activité · 30 jours</h2></div>'
      +courbe([{ nom:'Visites', couleur:'#3b82f6', valeurs:V.map(function(v){ return v.n; }) },{ nom:'Inscriptions', couleur:'#10b981', valeurs:K.insc.map(function(x){ return x.n; }) },{ nom:'Avis', couleur:'#f59e0b', valeurs:K.avisJ.map(function(x){ return x.n; }) },{ nom:'Demandes Pro', couleur:'#d946ef', valeurs:K.proJ.map(function(x){ return x.n; }) }],{ labels:V.map(function(v){ return v.jour; }) })+'</div>'
      +'<div class="box" style="margin-top:18px"><div class="bh"><span class="ico">'+I('clock')+'</span><h2>Toutes les activités récentes</h2></div>'+activites(30)+'</div>';
  }
  function vParams(){ var th=document.documentElement.getAttribute('data-theme'), u=A.currentUser||{};
    return entete('Paramètres','')
      +'<div class="box"><div class="set"><div><b>Thème</b><div class="sub">'+(th==='light'?'Clair':'Sombre')+'</div></div><button class="sw" type="button" id="th2">'+(th==='light'?'Passer en sombre 🌙':'Passer en clair ☀️')+'</button></div>'
      +'<div class="set"><div><b>Compte administrateur</b><div class="sub">'+esc(u.email||'')+'</div></div></div>'
      +'<div class="set"><div><b>Stripe</b><div class="sub">Paiements, clients, factures</div></div><a class="sw" href="https://dashboard.stripe.com" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Ouvrir ↗</a></div>'
      +'<div class="set"><div><b>Firebase</b><div class="sub">Base de données et comptes</div></div><a class="sw" href="https://console.firebase.google.com/project/careerpulseeva" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Ouvrir ↗</a></div>'
      +'<div class="set"><div><b>Vercel</b><div class="sub">Hébergement du site</div></div><a class="sw" href="https://vercel.com/dashboard" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Ouvrir ↗</a></div>'
      +'<div class="set"><div><b>Données</b><div class="sub">Mises à jour le '+fd(D.maj,true)+'</div></div><button class="sw" type="button" id="rf">Actualiser</button></div></div>';
  }

  function rendre(){
    var V={ home:vHome, visiteurs:vVisiteurs, membres:vMembres, avis:vAvis, pro:vPro, revenus:vRevenus, stats:vStats, params:vParams };
    app.innerHTML=shell((V[VUE]||vHome)()); bind();
    var th2=document.getElementById('th2'); if(th2) th2.onclick=function(){ document.getElementById('th').click(); };
    var rf=document.getElementById('rf'); if(rf) rf.onclick=function(){ charger(true); };
    var clr=document.getElementById('clr'); if(clr) clr.onclick=function(){ MQ=''; rendre(); };
  }

  function charger(silencieux){
    if(!silencieux || !D) app.innerHTML='<div class="load">Chargement des données…</div>';
    api('GET').then(function(j){
      if(j._code===200){ D=j; rendre(); return; }
      var msg=j._code===403&&j.uid?'<b>Dernière étape.</b> Copie ton identifiant ci-dessous et colle-le dans Vercel (Settings → Environment Variables) sous le nom <b>ADMIN_UID</b>, puis fais <b>Redeploy</b>.<br><br><code>'+esc(j.uid)+'</code>'
        : j._code===403?'<b>Accès refusé.</b> Ce compte n\'est pas le compte administrateur.' : esc(j.erreur||('Impossible de charger les données (code '+j._code+').'));
      app.innerHTML='<div class="login"><div class="box"><div class="brand">'+LOGO+'CareerPulse</div><div class="note">'+msg+'</div><button class="gg" type="button" id="lo2" style="margin-top:14px">Se déconnecter</button></div></div>';
      document.getElementById('lo2').onclick=function(){ A.signOut(); };
    }).catch(function(){ toast('Connexion au serveur impossible. Réessaie dans un instant.'); });
  }

  A.onAuthStateChanged(function(u){ if(u) charger(); else { D=null; loginView(); } });
})();
</script>
</body>
</html>
